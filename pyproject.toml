[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pybus"
version = "0.1.0"
description = "A JSON-first Python messaging framework with optional Redis and Django integrations."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "nanaduah1" }]
license = { text = "MIT" }
keywords = ["events", "commands", "messaging", "outbox", "inbox", "redis", "django"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
redis = ["redis>=6.0.0"]
django = ["Django>=4.2"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6.0"]

[project.urls]
Homepage = "https://github.com/nanaduah1/pybus"
Repository = "https://github.com/nanaduah1/pybus"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
